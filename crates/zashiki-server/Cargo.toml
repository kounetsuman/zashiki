[package]
name = "zashiki-server"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "デスクトップアプリのバックエンドとなる独立 Rust server"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
# rg --json（JSONL）のパース。transcript(jsonl) のイベント読みにも使う。
serde_json = "1"
# jsonl タイトル抽出でのスラッシュコマンドのメタタグ除去。
regex = "1"
# 静的配信（client dist）+ CORS（dev の webview は localhost:5173 から 127.0.0.1:8790 を叩く＝
# クロスオリジン。許可オリジンにのみ ACAO を返す。#290）。
tower-http = { version = "0.6", features = ["fs", "cors"] }
# git status のパース等、server ロジックを寄せる先。
zashiki-core = { path = "../zashiki-core" }
# tmux 撤去（#11 / Phase B）: サーバが各セッションの PTY を単一所有する。PoC #93 で採用・実測した版。
portable-pty = "0.9"
# ヘッドレス端末エミュレータ。生 PTY 出力から可視画面を再構成し tmux `capture-pane` を置換する（#11 ③）。
vt100 = "0.16"
# セッション終了時のプロセスグループ kill（killpg）。portable-pty が子を setsid する＝pgid==pid なので
# `kill(-pid)` で孫まで確実に落とす（居残り防止・#11）。
libc = "0.2"
# session.new の claude 起動に付ける session-id（save/restore 成立条件）。
uuid = { version = "1", features = ["v4"] }
# GitHub Releases の更新チェック（#26）。日次ポーリングだけなので非同期 HTTP スタックは引かず、
# blocking client を spawn_blocking 上で回す。rustls を使い OpenSSL を引き込まない。
ureq = { version = "2", default-features = false, features = ["tls"] }
# 起動中バンドルと最新リリースの semver 比較（1.0.0-rc.1 < 1.0.0 の prerelease 順序を含む）。
semver = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# テストでファイルの mtime を決定的に設定する（鮮度秒の検証）。
filetime = "0.2"
# /ws/control の結線を実 WS クライアントで検証する。
tokio-tungstenite = "0.24"
futures-util = "0.3"
