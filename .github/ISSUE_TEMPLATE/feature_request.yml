name: 機能提案
description: 新機能・改善を提案する
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。重複を避けるため、既存の Issue（closed 含む）を先に検索してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな場面で困っているか。なぜ必要か
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・検討したこと
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 補足
    validations:
      required: false
