name: npm publish

# vX.Y.Z tag の push で npm パッケージ（zashiki + @zashiki/server-darwin-{arm64,x64}）を publish する。
# repo 上の version は 0.0.0 プレースホルダー（誤 publish 防止）で固定し、実 version は tag から
# CI 内でのみ注入する（release.yml の dmg 配布と同一方針）。prepublishOnly ガードは 0.0.0 を拒否
# するので、注入前・ローカルの誤 publish は落ちる。
#
# 事前準備（人手・一度きり）:
#   - npm の Automation トークンを secrets.NPM_TOKEN に登録する（@zashiki scope の publish 権限が必要）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "publish する tag（vX.Y.Z 形式）。既存 tag を指定して再実行する用途"
        required: true
        type: string

jobs:
  npm-publish:
    # darwin バイナリのビルドと verify:npm-pack（実サーバ起動疎通）に macOS ランナーが要る。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zashiki-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 3 パッケージへ同一 version を注入する。cli の optionalDependencies は workspace:* なので、
      # pnpm publish 時に「そのとき解決される workspace 版 = この version」へ書き換わる。
      - name: Inject version from tag
        run: |
          for pkg in packages/cli packages/server-darwin-arm64 packages/server-darwin-x64; do
            jq --arg v "${{ steps.tag.outputs.version }}" '.version = $v' "$pkg/package.json" > "$pkg/package.json.tmp"
            mv "$pkg/package.json.tmp" "$pkg/package.json"
          done

      # client dist の同梱 + arm64 バイナリ配置 + tarball 展開 → 実 CLI 起動疎通までを gate する。
      - name: Verify npm pack (arm64 connectivity)
        run: pnpm verify:npm-pack

      - name: Build x64 server binary (cross)
        run: node scripts/build-npm-server-binary.mjs darwin-x64

      # 依存の解決順: consumer が zashiki を入れた時 optionalDependency を取得できるよう、
      # プラットフォームパッケージを先に publish してから cli を publish する。
      - name: Publish @zashiki/server-darwin-arm64
        run: pnpm --filter @zashiki/server-darwin-arm64 publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @zashiki/server-darwin-x64
        run: pnpm --filter @zashiki/server-darwin-x64 publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish zashiki (cli)
        run: pnpm --filter zashiki publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
