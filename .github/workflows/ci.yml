name: CI

on:
  push:
    branches: [main]
  pull_request:

# 全ジョブは checkout と読み取りしか行わないため、GITHUB_TOKEN を読み取り専用に絞る。
permissions:
  contents: read

# 連続 push した際、進行中の古い run を即キャンセルして Actions 分を節約する。
# main への push は完走させる（マージ後の正準ビルドを取りこぼさない）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更パスを判定し、無関係なジョブを skip して Actions 分を節約する。
  # skip されたジョブは "skipped" として完了扱いになる（このリポジトリは required check 未設定）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.css'
              - '**/*.html'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/ci.yml'

  ci:
    needs: changes
    # main の push は正準 smoke として常に回す。PR は JS 系変更時のみ。
    if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ブラウザモード e2e（Playwright / issue #200）。正常系のみ・薄く疎通を守る。
  # サーバは boot.mjs が Rust zashiki-server を owned モードで固定トークン起動する（Node 非依存）。
  # 重いので PR でのみ・JS/Rust いずれかが変わった時だけ回す（マージ後の main では PR で検証済みのため回さない）。
  e2e:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zashiki-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Build zashiki-server (e2e sidecar)
        run: cargo build --manifest-path crates/zashiki-server/Cargo.toml

      - name: Install Playwright browser
        run: pnpm -F @zashiki/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # zashiki-core（純関数）と zashiki-server（Rust server）。
  # いずれも GTK 不要。テストをここで守る。
  # Rust 変更時・PR のみ（マージ後の main では回さない）。
  core-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/zashiki-core
            crates/zashiki-server

      - name: Cargo test (zashiki-core)
        run: cargo test --manifest-path crates/zashiki-core/Cargo.toml --locked

      - name: Cargo test (zashiki-server)
        run: cargo test --manifest-path crates/zashiki-server/Cargo.toml --locked

  # Tauri シェル（apps/desktop）。ubuntu で cargo check/test まで
  # （フル bundle は重いので回さない。macOS bundle は手動 or 将来の配布 issue で）
  # Rust 変更時・PR のみ（マージ後の main では回さない）。
  tauri-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
