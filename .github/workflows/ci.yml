name: CI

on:
  push:
    branches: [main]
  pull_request:

# 全ジョブは checkout と読み取りしか行わないため、GITHUB_TOKEN を読み取り専用に絞る。
permissions:
  contents: read

# 連続 push した際、進行中の古い run を即キャンセルして Actions 分を節約する。
# main への push は完走させる（マージ後の正準ビルドを取りこぼさない）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更パスを判定し、無関係なジョブを skip して Actions 分を節約する。
  # skip されたジョブは "skipped" として完了扱いになる（このリポジトリは required check 未設定）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            js:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.css'
              - '**/*.html'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/ci.yml'

  ci:
    needs: changes
    # main の push は正準 smoke として常に回す。PR は JS 系変更時のみ。
    if: ${{ github.event_name == 'push' || needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ブラウザモード e2e（Playwright / issue #200）。正常系のみ・薄く疎通を守る。
  # サーバは boot.mjs が Rust zashiki-server を owned モードで固定トークン起動する（Node 非依存）。
  # 重いので PR でのみ・JS/Rust いずれかが変わった時だけ回す（マージ後の main では PR で検証済みのため回さない）。
  e2e:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/zashiki-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Build zashiki-server (e2e sidecar)
        run: cargo build --manifest-path crates/zashiki-server/Cargo.toml

      - name: Install Playwright browser
        run: pnpm -F @zashiki/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # zashiki-core（純関数）と zashiki-server（Rust server）。
  # いずれも GTK 不要。テストをここで守る。
  # Rust 変更時・PR のみ（マージ後の main では回さない）。
  core-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/zashiki-core
            crates/zashiki-server

      - name: Cargo test (zashiki-core)
        run: cargo test --manifest-path crates/zashiki-core/Cargo.toml --locked

      - name: Cargo test (zashiki-server)
        run: cargo test --manifest-path crates/zashiki-server/Cargo.toml --locked

  # Tauri シェル（apps/desktop）。ubuntu で cargo check/test まで
  # （フル bundle は重いので回さない。macOS bundle は手動 or 将来の配布 issue で）
  # Rust 変更時・PR のみ（マージ後の main では回さない）。
  tauri-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
