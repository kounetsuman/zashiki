name: Release

# vX.Y.Z tag の push で macOS 配布物（Zashiki.dmg）を draft Release として公開する。
# 準備段（client dist / server binary の同梱物配置）は scripts/build-app.sh を single source
# として再利用し、tauri build 本体は tauri-action に委ねる（二重管理を避ける）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースする tag（vX.Y.Z 形式）。既存 tag を指定して再実行する用途"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Populate the Release body from CHANGELOG.md: extract the [X.Y.Z] section so a
      # normal release ships curated notes with no hand-editing. Fall back to GitHub's
      # auto-generated notes when there is no matching section (e.g. a prerelease tag).
      - name: Compute release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BODY=$(awk -v v="$VERSION" '
            function flush() { while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--; for (i = 1; i <= n; i++) print lines[i] }
            $0 ~ "^## \\[" v "\\]" { inx = 1; next }
            inx && (/^## / || /^\[[^]]+\]:[[:space:]]/) { inx = 0 }
            inx { if (!(n == 0 && $0 ~ /^[[:space:]]*$/)) lines[++n] = $0 }
            END { flush() }
          ' CHANGELOG.md)
          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::warning::no [$VERSION] section in CHANGELOG.md — using auto-generated notes"
            BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ steps.tag.outputs.tag }}" --jq .body)
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/zashiki-server
            apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .app の CFBundleVersion は tauri.conf.json の version が支配するため、tag から注入する
      # （リポジトリ上の 0.0.0 は誤 publish 防止のプレースホルダー。書き換えは CI 内に閉じる）。
      - name: Inject version from tag
        run: |
          jq --arg v "${{ steps.tag.outputs.version }}" '.version = $v' \
            apps/desktop/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp apps/desktop/src-tauri/tauri.conf.json

      - name: Prepare bundle payload (client dist + server binary)
        run: bash scripts/build-app.sh --prepare-only

      # Sign + notarize only when the APPLE_CERTIFICATE secret is configured; otherwise
      # fall back to an unsigned build (see apps/desktop/README.md "Signing & notarization").
      - name: Detect signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPLE_CERTIFICATE secret is not set — building an UNSIGNED app."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Import the Developer ID Application cert into a throwaway keychain and forward the
      # signing identity + notarization credentials to the build step (unset in the unsigned
      # path, so the Tauri bundler skips signing entirely).
      - name: Import Apple Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          # Prepend the temp keychain to the existing search list (keep login.keychain-db so the
          # Developer ID intermediate stays resolvable), rather than replacing it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[[:space:]"]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build app & publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # .app ディレクトリは Release アセットにできないため dmg で配布する（.app は dmg に内包）。
          args: --config src-tauri/tauri.bundle.conf.json --bundles dmg
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Zashiki ${{ steps.tag.outputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # Gate the release on a valid signature + stapled notarization ticket for signed builds.
      # Verify the shipped .dmg: the bundler removes the intermediate .app after packaging it,
      # so mount the dmg and check the .app inside (what users actually download).
      - name: Verify signature & notarization
        if: steps.signing.outputs.enabled == 'true'
        run: |
          DMG=$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG" || { echo "::error::no .dmg found to verify"; exit 1; }
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -Eo '/Volumes/.*' | tail -1)
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv "$APP"
          xcrun stapler validate "$APP"
